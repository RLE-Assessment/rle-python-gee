[project]
name = "rle-python-gee"
version = "0.2.1"
description = "Google Earth Engine data-access backends for rle-python (IUCN Red List of Ecosystems)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rle-python>=0.2,<0.3",
    "earthengine-api>=1.6.14",
    "geemap>=0.36.6",
    "cartopy>=0.24.0",
    "matplotlib>=3.9.0",
    "requests>=2.32.0",
    "wkls>=1.0.1",
    "gcsfs",
    "pyyaml>=6.0.3",
    "typer>=0.20.0",
    "ipykernel>=7.1.0",
]

[project.optional-dependencies]
viz = ["lonboard"]

[project.scripts]
rle-gee = "rle.gee.cli:app"

[project.entry-points."rle.backends"]
gee = "rle.gee._entrypoints:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/rle/gee"]
sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests (mocked, fast, no Earth Engine authentication required)",
    "integration: Integration tests (requires Earth Engine authentication, slower)",
]
